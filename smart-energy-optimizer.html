<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Energy Usage Optimizer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6f8;--panel:#fff;--side:#0f2a33;--text:#13242b;--muted:#64808a;--line:#e1e8ec;--acc:#0d9488;--acc2:#f59e0b;--bad:#e11d48;--soft:#e6f6f4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1519;--panel:#122229;--side:#08161b;--text:#e6f1f4;--muted:#8aa7b1;--line:#22373f;--acc:#2dd4bf;--soft:#12353a}}
:root[data-theme="dark"]{--bg:#0b1519;--panel:#122229;--side:#08161b;--text:#e6f1f4;--muted:#8aa7b1;--line:#22373f;--acc:#2dd4bf;--soft:#12353a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100%}
#root{min-height:100%}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--side);color:#cfe3e8;padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;color:#fff;font-size:15px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#14b8a6,#f59e0b);display:grid;place-items:center;font-size:18px}
.nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:9px;width:100%;box-sizing:border-box;color:#b6d0d6}
.nav button:hover{background:#ffffff14}.nav button.on{background:#14b8a62e;color:#fff;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#ffffff14;border-radius:10px;padding:3px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:7px;border-radius:8px;color:#b6d0d6;font-weight:600}
.seg button.on{background:var(--acc);color:#04201d}
.ctl{font-size:12px;color:#9fbcc3;display:flex;flex-direction:column;gap:5px}
.ctl b{color:#fff;font-weight:600}
.side input[type=range]{width:100%;accent-color:#2dd4bf}
.main{padding:20px 24px 40px;min-width:0}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
h1{font-size:21px;margin:0}h2{font-size:15px;margin:0}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#f59e0b26;color:#b45309;border:1px solid #f59e0b66}
@media (prefers-color-scheme:dark){.chip{color:#fbbf24}}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr}.g2e{grid-template-columns:1fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.lab{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:27px;font-weight:750;margin:4px 0 2px}.sub{color:var(--muted);font-size:12px}
.good{color:var(--acc);font-weight:700}.bad{color:var(--bad);font-weight:700}
button.b{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 12px;border-radius:9px;font-weight:600;font:inherit;font-weight:600}
button.b:hover{border-color:var(--acc)}button.p{background:var(--acc);color:#04201d;border-color:var(--acc)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;letter-spacing:.04em}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 7px;max-width:100%}
input[type=number]{width:72px}input[type=range]{accent-color:var(--acc)}
.sw{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;border:0;padding:0}
.sw i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--acc)}.sw.on i{left:19px}
.rec{display:flex;gap:12px;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;flex-wrap:wrap}
.rec.ap{background:var(--soft);border-color:var(--acc)}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);margin-top:6px}.leg span i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
svg text{fill:var(--muted);font-size:10px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:6px;animation:p 1.2s infinite}.paused{background:#94a3b8;animation:none}
@keyframes p{50%{opacity:.25}}
.foot{margin-top:18px;color:var(--muted);font-size:12px}
@media (max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g2,.g2e{grid-template-columns:1fr}}
@media (max-width:800px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.nav button{justify-content:center;padding:8px 4px;font-size:12px}.main{padding:14px}}
@media (max-width:480px){.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
/*LOGIC*/
const HRS=[...Array(24).keys()],DAYS={home:30,office:26},PEAK=h=>h>=18&&h<22;
const A=(id,name,watts,qty,start,dur,duty,tag)=>({id,name,watts,qty,start,dur,duty,tag,on:true});
const SEED={home:[A('ac1','Bedroom AC (1.5 ton)',1400,1,22,7,.65,'cool'),A('ac2','Living room AC',1500,1,14,4,.6,'cool'),A('fr','Refrigerator',150,1,0,24,.4,''),A('gy','Water heater (geyser)',2000,1,6,1,1,''),A('li','Lighting (CFL/bulbs)',480,1,18,5,1,'light'),A('wm','Washer + dryer',2000,1,19,2,.8,'shift'),A('tv','TV & set-top box',120,1,19,4,1,''),A('fn','Ceiling fans',300,1,18,12,.7,''),A('kt','Kitchen appliances',1800,1,7,1,.5,''),A('sb','Standby / Wi-Fi / chargers',40,1,0,24,1,'standby')],
office:[A('hv','Central HVAC',6000,1,9,10,.7,'cool'),A('li','Lighting (tube lights)',1200,1,9,10,1,'light'),A('pc','Workstations (30)',150,30,9,9,.8,'pc'),A('sv','Servers & network',800,1,0,24,1,''),A('pr','Printers & copiers',600,1,9,9,.25,''),A('pa','Pantry equipment',1500,1,10,8,.2,''),A('pu','Lift & water pumps',1500,1,8,12,.3,''),A('id','After-hours idle equipment',500,1,18,14,1,'standby')]};
const tempAt=(T,h)=>T-4+4*Math.sin(Math.PI*(h-9)/12);
const load=(a,h,T)=>{if(!a.on||((h-a.start+24)%24)>=a.dur)return 0;let w=a.watts*a.qty*a.duty;if(a.tag==='cool')w*=Math.max(.3,1+.04*(tempAt(T,h)-32));return w/1000};
const hourly=(apps,T)=>HRS.map(h=>apps.reduce((s,a)=>s+load(a,h,T),0));
const SLABS=[[100,4.5],[200,7],[200,9.5],[1e9,11]],OFF=9.5,TOD=2.5,FUEL=.4,DUTY=.08;
function bill(kwh,peak,mode,tod){let rows=[],energy=0;if(mode==='home'){let rem=kwh,lo=0;SLABS.forEach(([lim,r])=>{const q=Math.max(0,Math.min(rem,lim));rem-=q;rows.push({label:lim>1e8?`${lo+1}+ units`:`${lo+1}–${lo+lim} units`,q,rate:r,amt:q*r});energy+=q*r;lo+=lim})}else{energy=kwh*OFF;rows=[{label:'Commercial flat tariff',q:kwh,rate:OFF,amt:energy}]}
const fixed=mode==='home'?120:450,todc=tod?peak*TOD:0,fuel=kwh*FUEL,duty=DUTY*(energy+todc+fuel);return{rows,energy,todc,fuel,fixed,duty,total:energy+todc+fuel+fixed+duty}}
function summarize(apps,T,mode,tod){const hr=hourly(apps,T),d=mode,daily=hr.reduce((a,b)=>a+b,0),monthly=daily*DAYS[d],pk=hr.filter((_,h)=>PEAK(h)).reduce((a,b)=>a+b,0)*DAYS[d];return{hr,daily,monthly,pk,b:bill(monthly,pk,mode,tod)}}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const HIST={};['home','office'].forEach((m,i)=>{const r=rng(42+i),base=hourly(SEED[m],36),days=[];for(let d=0;d<7;d++)days.push(base.map(v=>v*(.9+r()*.2)));
HIST[m]={avg:HRS.map(h=>days.reduce((s,x)=>s+x[h],0)/7),sd:HRS.map(h=>{const mu=days.reduce((s,x)=>s+x[h],0)/7;return Math.sqrt(days.reduce((s,x)=>s+(x[h]-mu)**2,0)/7)}),sums:days.map(x=>x.reduce((a,b)=>a+b,0))}});
/* Forecast: 80% physics/schedule model (current settings + temperature) blended with 20% 7-day seasonal average; band from historical std-dev */
function forecast(apps,T,mode,now){const m=hourly(apps,T),H=HIST[mode];return Array.from({length:24},(_,k)=>{const h=(now+k)%24,f=.8*m[h]+.2*H.avg[h],bd=.05*f+H.sd[h];return{h,f,lo:Math.max(0,f-bd),hi:f+bd}})}
const RECS=[{id:'setpoint',tag:'cool',title:'Set AC thermostat to 26°C',desc:'Each °C higher cuts cooling energy ~6%. Modelled as −12% on cooling load.',fn:a=>a.map(x=>x.tag==='cool'?{...x,watts:x.watts*.88}:x)},
{id:'inverter',tag:'cool',title:'Upgrade to 5-star inverter cooling',desc:'Variable-speed compressors use ~28% less energy than fixed-speed units.',fn:a=>a.map(x=>x.tag==='cool'?{...x,watts:x.watts*.72}:x)},
{id:'led',tag:'light',title:'Replace lighting with LED',desc:'LEDs deliver the same light at ~60% lower wattage.',fn:a=>a.map(x=>x.tag==='light'?{...x,watts:x.watts*.4}:x)},
{id:'shift',tag:'shift',title:'Shift washer/dryer to 11:00 (off-peak)',desc:'Avoids the 18:00–22:00 peak surcharge (needs Time-of-Day pricing on).',fn:a=>a.map(x=>x.tag==='shift'?{...x,start:11}:x)},
{id:'standby',tag:'standby',title:'Cut standby load with smart power strips',desc:'Switch off idle devices automatically; removes ~70% of standby draw.',fn:a=>a.map(x=>x.tag==='standby'?{...x,watts:x.watts*.3}:x)},
{id:'pcsleep',tag:'pc',title:'Enable PC sleep & power-saving mode',desc:'Aggressive sleep timers reduce workstation energy by ~25%.',fn:a=>a.map(x=>x.tag==='pc'?{...x,watts:x.watts*.75}:x)}];
const applyRecs=(base,ids)=>RECS.filter(r=>ids.includes(r.id)).reduce((a,r)=>r.fn(a),base);
const INR=n=>'₹'+Math.round(n).toLocaleString('en-IN'),F1=n=>n.toFixed(1),F2=n=>n.toFixed(2);
/*UI*/
const {useState,useEffect,useMemo,useRef}=React;const html=htm.bind(React.createElement);
const PAL=['#0d9488','#f59e0b','#6366f1','#e11d48','#0ea5e9','#84cc16','#a855f7','#f97316','#14b8a6','#94a3b8','#ec4899','#eab308'];
function Stack({apps,T,cur}){const W=640,H=230,L=34,B=22,Tp=10,lay=apps.map(a=>HRS.map(h=>load(a,h,T))),tot=HRS.map(h=>lay.reduce((s,l)=>s+l[h],0)),mx=Math.max(.5,...tot)*1.1,bw=(W-L-6)/24,y=v=>Tp+(H-Tp-B)*(1-v/mx);
return html`<svg viewBox="0 0 ${W} ${H}" width="100%">${[0,.25,.5,.75,1].map(t=>html`<g key=${t}><line x1=${L} x2=${W} y1=${y(mx*t)} y2=${y(mx*t)} stroke="var(--line)"/><text x=${L-4} y=${y(mx*t)+3} text-anchor="end">${F1(mx*t)}</text></g>`)}
${HRS.map(h=>{let c=0;return html`<g key=${h}><title>${h}:00 — ${F2(tot[h])} kW</title>${lay.map((l,i)=>{const v=l[h];if(!v)return null;const r=html`<rect key=${i} x=${L+h*bw+1.5} width=${bw-3} y=${y(c+v)} height=${y(c)-y(c+v)} fill=${PAL[i%12]} opacity=${h===cur?1:.8}/>`;c+=v;return r})}${h%3===0&&html`<text x=${L+h*bw+bw/2} y=${H-6} text-anchor="middle">${h}h</text>`}${h===cur&&html`<rect x=${L+h*bw} y=${Tp} width=${bw} height=${H-Tp-B} fill="none" stroke="var(--acc2)" stroke-width="1.5" rx="3"/>`}</g>`})}</svg>`}
function Line({data}){const W=640,H=210,L=34,B=22,Tp=10,mx=Math.max(.5,...data.map(d=>d.hi))*1.1,x=k=>L+k*(W-L-8)/23,y=v=>Tp+(H-Tp-B)*(1-v/mx),pk=data.reduce((b,d,k)=>d.f>data[b].f?k:b,0);
return html`<svg viewBox="0 0 ${W} ${H}" width="100%">${[0,.5,1].map(t=>html`<g key=${t}><line x1=${L} x2=${W} y1=${y(mx*t)} y2=${y(mx*t)} stroke="var(--line)"/><text x=${L-4} y=${y(mx*t)+3} text-anchor="end">${F1(mx*t)}</text></g>`)}
<polygon points=${data.map((d,k)=>`${x(k)},${y(d.hi)}`).join(' ')+' '+data.map((d,k)=>[x(k),y(d.lo)]).reverse().map(p=>p.join(',')).join(' ')} fill="var(--acc)" opacity=".15"/>
<polyline points=${data.map((d,k)=>`${x(k)},${y(d.f)}`).join(' ')} fill="none" stroke="var(--acc)" stroke-width="2.5"/>
${data.map((d,k)=>html`<g key=${k}><circle cx=${x(k)} cy=${y(d.f)} r="3" fill="var(--acc)"><title>${d.h}:00 — ${F2(d.f)} kW (${F2(d.lo)}–${F2(d.hi)})</title></circle>${k%4===0&&html`<text x=${x(k)} y=${H-6} text-anchor="middle">${d.h}:00</text>`}</g>`)}
<circle cx=${x(pk)} cy=${y(data[pk].f)} r="6" fill="none" stroke="var(--acc2)" stroke-width="2"/><text x=${x(pk)} y=${y(data[pk].f)-10} text-anchor="middle" style=${{fill:'var(--acc2)',fontWeight:700}}>peak ${F2(data[pk].f)} kW</text></svg>`}
function Bars({vals,labels,hi}){const W=420,H=170,mx=Math.max(...vals)*1.15,bw=(W-20)/vals.length;return html`<svg viewBox="0 0 ${W} ${H}" width="100%">${vals.map((v,i)=>{const h=(H-34)*v/mx;return html`<g key=${i}><rect x=${10+i*bw+6} width=${bw-12} y=${H-20-h} height=${h} rx="4" fill=${i===hi?'var(--acc2)':'var(--acc)'} opacity=${i===hi?1:.7}/><text x=${10+i*bw+bw/2} y=${H-20-h-4} text-anchor="middle">${Math.round(v)}</text><text x=${10+i*bw+bw/2} y=${H-6} text-anchor="middle">${labels[i]}</text></g>`})}</svg>`}
function Spark({s}){const W=300,H=60,mx=Math.max(...s,.5)*1.2,mn=Math.min(...s)*.8;return html`<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="var(--acc)" stroke-width="2" points=${s.map((v,i)=>`${i*W/59},${H-(H-4)*(v-mn)/(mx-mn||1)-2}`).join(' ')}/></svg>`}
const Metric=({l,v,s,c})=>html`<div class="card"><div class="lab">${l}</div><div class="big" style=${{color:c}}>${v}</div><div class="sub">${s}</div></div>`;
const Switch=({on,set})=>html`<button class=${'sw '+(on?'on':'')} onClick=${()=>set(!on)} aria-label="toggle"><i></i></button>`;

function App(){
const [mode,setMode]=useState('home'),[page,setPage]=useState('dash'),[data,setData]=useState(SEED),[applied,setApplied]=useState({home:[],office:[]}),[T,setT]=useState(36),[tod,setTod]=useState(true),[hOv,setHOv]=useState(null),[paused,setPaused]=useState(false),[budget,setBudget]=useState({home:3500,office:38000}),[nw,setNw]=useState({n:'',w:500});
const base=data[mode],ids=applied[mode],apps=useMemo(()=>applyRecs(base,ids),[base,ids]);
const hour=hOv==null?new Date().getHours():hOv;
const S=useMemo(()=>summarize(apps,T,mode,tod),[apps,T,mode,tod]);
const fc=useMemo(()=>forecast(apps,T,mode,hour),[apps,T,mode,hour]);
const marg=(bill(S.monthly+1,S.pk,mode,tod).total-S.b.total);
const ev=list=>summarize(applyRecs(base,list),T,mode,tod);
const recs=RECS.filter(r=>base.some(a=>a.tag===r.tag)).map(r=>{const w=ev([...new Set([...ids,r.id])]),wo=ev(ids.filter(i=>i!==r.id));return{...r,on:ids.includes(r.id),sav:wo.b.total-w.b.total,kwh:wo.monthly-w.monthly}});
const none=ev([]),all=ev(recs.map(r=>r.id)),potential=none.b.total-all.b.total;
const upd=(id,p)=>setData(d=>({...d,[mode]:d[mode].map(a=>a.id===id?{...a,...p}:a)}));
const num=(v,lo,hi)=>Math.min(hi,Math.max(lo,Number(v)||lo));
const toggleRec=id=>setApplied(p=>({...p,[mode]:p[mode].includes(id)?p[mode].filter(i=>i!==id):[...p[mode],id]}));
/* live meter */
const tgt=useRef(0),pz=useRef(false);tgt.current=S.hr[hour];pz.current=paused;
const [lv,setLv]=useState({kw:S.hr[hour],s:Array(60).fill(S.hr[hour]),v:230,hz:50,kwh:0});
useEffect(()=>{const t=setInterval(()=>{if(pz.current)return;setLv(p=>{const g=tgt.current,kw=Math.max(.05,p.kw+(g-p.kw)*.35+(Math.random()-.5)*.1*Math.max(g,.4));return{kw,s:[...p.s.slice(-59),kw],v:230+(Math.random()-.5)*6,hz:50+(Math.random()-.5)*.1,kwh:p.kwh+kw/3600}})},1000);return()=>clearInterval(t)},[]);
const sofar=S.hr.slice(0,hour).reduce((a,b)=>a+b,0)+S.hr[hour]*.5;
const f24=fc.reduce((s,d)=>s+d.f,0),pkd=fc.reduce((b,d)=>d.f>b.f?d:b,fc[0]);
const perApp=base.map((a,i)=>{const e=apps.find(x=>x.id===a.id)||a,kwh=HRS.reduce((s,h)=>s+load(e,h,T),0);return{a:e,i,kwh}});const maxK=Math.max(...perApp.map(p=>p.kwh),.1);
const co2=S.monthly*.82,over=S.b.total-budget[mode];
const nav=[['dash','▦','Dashboard'],['app','⚙','Appliances'],['fc','↗','Forecast'],['bill','₹','Bill estimate'],['sav','✦','Savings']];
const Wk=useMemo(()=>{const sc=S.daily/(HIST[mode].sums.reduce((a,b)=>a+b,0)/7);return[...HIST[mode].sums.slice(0,6).map(v=>v*sc),S.daily]},[S.daily,mode]);

const Dash=html`<div class="grid" style=${{gap:14}}>
<div class="grid g4"><${Metric} l="Live load" v=${F2(lv.kw)+' kW'} s=${'Simulated meter · '+Math.round(lv.kw*1000/lv.v/.92*10)/10+' A'} c="var(--acc)"/><${Metric} l="Today so far / est." v=${F1(sofar)+' kWh'} s=${'Full day est. '+F1(S.daily)+' kWh'}/><${Metric} l="Est. monthly bill" v=${INR(S.b.total)} s=${F1(S.monthly)+' kWh · '+DAYS[mode]+' days'}/><${Metric} l="Potential savings" v=${INR(potential)+'/mo'} s=${'≈ '+Math.round(potential*12).toLocaleString('en-IN')+' per year'} c="var(--acc)"/></div>
<div class="grid g2"><div class="card"><div class="h"><h2>Hourly consumption by appliance (kW)</h2><span class="sub">Highlighted = current hour (${hour}:00)</span></div><${Stack} apps=${apps} T=${T} cur=${hour}/><div class="leg">${apps.map((a,i)=>html`<span key=${a.id}><i style=${{background:PAL[i%12]}}></i>${a.name}</span>`)}</div></div>
<div class="card"><div class="h"><h2><span class=${'pulse '+(paused?'paused':'')}></span>Live energy meter</h2><button class="b" onClick=${()=>setPaused(!paused)}>${paused?'▶ Resume':'❚❚ Pause'}</button></div><div class="big">${F2(lv.kw)} <span style=${{fontSize:15}}>kW</span></div><${Spark} s=${lv.s}/><div class="sub">Last 60 seconds · target load for ${hour}:00 is ${F2(S.hr[hour])} kW</div><div class="grid" style=${{gridTemplateColumns:'repeat(3,1fr)',marginTop:10}}><div><div class="lab">Voltage</div><b>${F1(lv.v)} V</b></div><div><div class="lab">Freq</div><b>${F2(lv.hz)} Hz</b></div><div><div class="lab">Session</div><b>${lv.kwh.toFixed(3)} kWh</b></div></div></div></div>
<div class="grid g2e"><div class="card"><div class="h"><h2>Next 24 h forecast (kW)</h2><button class="b" onClick=${()=>setPage('fc')}>Details →</button></div><${Line} data=${fc}/><div class="sub">Expected ${F1(f24)} kWh · peak at ${pkd.h}:00</div></div>
<div class="card"><h2>Last 6 days vs today (kWh) <span class="chip">simulated</span></h2><${Bars} vals=${Wk} labels=${['D-6','D-5','D-4','D-3','D-2','D-1','Today']} hi=${6}/></div></div>
<div class="card"><h2 style=${{marginBottom:10}}>Top consumers (kWh/day)</h2>${[...perApp].sort((a,b)=>b.kwh-a.kwh).slice(0,6).map(p=>html`<div key=${p.a.id} style=${{display:'grid',gridTemplateColumns:'minmax(110px,200px) 1fr 80px',gap:10,alignItems:'center',marginBottom:7}}><span>${p.a.name}</span><div class="bar"><i style=${{width:100*p.kwh/maxK+'%',background:PAL[p.i%12]}}></i></div><b>${F1(p.kwh)}</b></div>`)}</div></div>`;

const Apps=html`<div class="card"><div class="h"><h2>Appliance management — ${mode==='home'?'Household':'Office'} <span class="chip">simulated data</span></h2><span class="sub">Edits update every chart, forecast and bill instantly</span></div><div class="tw"><table><thead><tr><th>On</th><th>Appliance</th><th>Watts</th><th>Qty</th><th>Start</th><th>Hours</th><th>Duty %</th><th>kWh/day</th><th>₹/month</th><th></th></tr></thead><tbody>${base.map((a,i)=>{const k=perApp[i].kwh;return html`<tr key=${a.id} style=${{opacity:a.on?1:.5}}><td><${Switch} on=${a.on} set=${v=>upd(a.id,{on:v})}/></td><td><b>${a.name}</b></td><td><input type="number" value=${a.watts} onChange=${e=>upd(a.id,{watts:num(e.target.value,1,50000)})}/></td><td><input type="number" style=${{width:56}} value=${a.qty} onChange=${e=>upd(a.id,{qty:num(e.target.value,1,500)})}/></td><td><select value=${a.start} onChange=${e=>upd(a.id,{start:+e.target.value})}>${HRS.map(h=>html`<option key=${h} value=${h}>${h}:00</option>`)}</select></td><td><input type="number" style=${{width:56}} value=${a.dur} onChange=${e=>upd(a.id,{dur:num(e.target.value,1,24)})}/></td><td><input type="range" min="10" max="100" value=${a.duty*100} onChange=${e=>upd(a.id,{duty:e.target.value/100})}/> ${Math.round(a.duty*100)}</td><td>${F1(k)}</td><td>${INR(k*DAYS[mode]*marg)}</td><td><button class="b" onClick=${()=>setData(d=>({...d,[mode]:d[mode].filter(x=>x.id!==a.id)}))}>✕</button></td></tr>`})}</tbody></table></div>
<div style=${{display:'flex',gap:8,flexWrap:'wrap',marginTop:14,alignItems:'center'}}><b>Add appliance</b><input placeholder="Name" value=${nw.n} onChange=${e=>setNw({...nw,n:e.target.value})}/><input type="number" value=${nw.w} onChange=${e=>setNw({...nw,w:e.target.value})}/> W<button class="b p" onClick=${()=>{if(!nw.n.trim())return;setData(d=>({...d,[mode]:[...d[mode],A('n'+Date.now(),nw.n.trim(),num(nw.w,1,50000),1,18,4,.8,'')]}));setNw({n:'',w:500})}}>+ Add</button><button class="b" onClick=${()=>setData(d=>({...d,[mode]:SEED[mode]}))}>Reset ${mode} defaults</button></div><div class="sub" style=${{marginTop:8}}>₹/month uses the marginal rate (${F2(marg)} ₹/kWh at your current usage). Cooling appliances scale with the temperature slider.</div></div>`;

const Fc=html`<div class="grid" style=${{gap:14}}><div class="grid g4"><${Metric} l="Next 24 h" v=${F1(f24)+' kWh'} s="Forecast energy"/><${Metric} l="Peak hour" v=${pkd.h+':00'} s=${F2(pkd.f)+' kW expected'} c="var(--acc2)"/><${Metric} l="Est. 24 h cost" v=${INR(f24*marg)} s=${'at marginal '+F2(marg)+' ₹/kWh'}/><${Metric} l="Peak-window share" v=${Math.round(100*S.pk/DAYS[mode]/S.daily)+'%'} s="of daily use (18:00–22:00)"/></div>
<div class="card"><div class="h"><h2>24-hour load forecast from ${hour}:00</h2><span class="chip">simulated</span></div><${Line} data=${fc}/><div class="sub">Line = forecast, shaded = ±1 uncertainty band (5% + historical std-dev).</div></div>
<div class="card"><h2>How the forecast works</h2><p class="sub">Forecast(h) = 0.8 × schedule model(h) + 0.2 × 7-day same-hour average (simulated history). The schedule model sums every active appliance (watts × qty × duty), with cooling load scaled by the hourly temperature curve (+4% per °C above 32 °C, peaking at 15:00). Change appliances, temperature, or applied savings and it recomputes instantly.</p><div class="tw"><table><thead><tr><th>Hour</th>${fc.map(d=>html`<th key=${d.h}>${d.h}h</th>`)}</tr></thead><tbody><tr><td>kW</td>${fc.map(d=>html`<td key=${d.h} style=${{background:PEAK(d.h)?'#f59e0b33':'',padding:'7px 4px'}}>${F1(d.f)}</td>`)}</tr></tbody></table></div></div></div>`;

const Bill=html`<div class="grid" style=${{gap:14}}><div class="grid g4"><${Metric} l="Estimated bill" v=${INR(S.b.total)} s="per month"/><${Metric} l="Per day" v=${INR(S.b.total/DAYS[mode])} s=${F1(S.daily)+' kWh/day'}/><${Metric} l="CO₂ footprint" v=${Math.round(co2)+' kg'} s="0.82 kg/kWh grid factor"/><${Metric} l=${over>0?'Over budget':'Under budget'} v=${INR(Math.abs(over))} s=${'Budget '+INR(budget[mode])} c=${over>0?'var(--bad)':'var(--acc)'}/></div>
<div class="grid g2e"><div class="card"><div class="h"><h2>Bill breakdown <span class="chip">illustrative tariff</span></h2></div><div class="tw"><table style=${{minWidth:0}}><thead><tr><th>Slab</th><th>kWh</th><th>Rate</th><th>₹</th></tr></thead><tbody>${S.b.rows.map(r=>html`<tr key=${r.label}><td>${r.label}</td><td>${F1(r.q)}</td><td>${r.rate}</td><td>${INR(r.amt)}</td></tr>`)}<tr><td colspan="3">Peak surcharge (${tod?F1(S.pk)+' kWh × ₹'+TOD:'off'})</td><td>${INR(S.b.todc)}</td></tr><tr><td colspan="3">Fuel adjustment (₹${FUEL}/kWh)</td><td>${INR(S.b.fuel)}</td></tr><tr><td colspan="3">Fixed charge</td><td>${INR(S.b.fixed)}</td></tr><tr><td colspan="3">Electricity duty (8%)</td><td>${INR(S.b.duty)}</td></tr><tr><td colspan="3"><b>Total</b></td><td><b>${INR(S.b.total)}</b></td></tr></tbody></table></div></div>
<div class="card"><h2>Monthly budget tracker</h2><div class="sub" style=${{margin:'6px 0'}}>Budget: ${INR(budget[mode])}</div><input type="range" style=${{width:'100%'}} min=${mode==='home'?500:5000} max=${mode==='home'?10000:100000} step=${mode==='home'?100:1000} value=${budget[mode]} onChange=${e=>setBudget({...budget,[mode]:+e.target.value})}/><div class="bar" style=${{margin:'12px 0'}}><i style=${{width:Math.min(100,100*S.b.total/budget[mode])+'%',background:over>0?'var(--bad)':'var(--acc)'}}></i></div><p>${over>0?html`<span class="bad">Projected ${INR(over)} over budget.</span> Applying all recommendations would bring the bill to ${INR(all.b.total)}${all.b.total<=budget[mode]?' — within budget.':'.'}`:html`<span class="good">On track — ${INR(-over)} headroom.</span>`}</p></div></div></div>`;

const Sav=html`<div class="grid" style=${{gap:14}}><div class="grid g4"><${Metric} l="Bill without savings" v=${INR(none.b.total)} s="all measures off"/><${Metric} l="Bill with all measures" v=${INR(all.b.total)} s=${F1(all.monthly)+' kWh/month'}/><${Metric} l="Potential savings" v=${INR(potential)} s=${Math.round(100*potential/none.b.total)+'% per month'} c="var(--acc)"/><${Metric} l="Applied now" v=${INR(none.b.total-S.b.total)} s=${ids.length+' of '+recs.length+' measures'} c="var(--acc)"/></div>
<div class="card"><div class="h"><h2>Energy-saving recommendations</h2><span style=${{display:'flex',gap:8}}><button class="b p" onClick=${()=>setApplied({...applied,[mode]:recs.map(r=>r.id)})}>Apply all</button><button class="b" onClick=${()=>setApplied({...applied,[mode]:[]})}>Reset</button></span></div>${[...recs].sort((a,b)=>b.sav-a.sav).map(r=>html`<div key=${r.id} class=${'rec '+(r.on?'ap':'')}><div style=${{flex:'1 1 260px'}}><b>${r.title}</b><div class="sub">${r.desc}</div></div><div style=${{textAlign:'right'}}><div class="good">${INR(r.sav)}/mo</div><div class="sub">${F1(r.kwh)} kWh · ${Math.round(r.kwh*.82)} kg CO₂</div></div><button class=${'b '+(r.on?'':'p')} onClick=${()=>toggleRec(r.id)}>${r.on?'✓ Applied — undo':'Apply'}</button></div>`)}<div class="sub">Savings are computed by re-running the full bill model with and without each measure, so they reflect your current appliances, slabs and tariff settings.</div></div></div>`;

return html`<div class="app"><aside class="side"><div class="brand"><div class="logo">⚡</div>Smart Energy Optimizer</div>
<div class="seg"><button class=${mode==='home'?'on':''} onClick=${()=>setMode('home')}>🏠 Household</button><button class=${mode==='office'?'on':''} onClick=${()=>setMode('office')}>🏢 Office</button></div>
<nav class="nav">${nav.map(([k,i,l])=>html`<button key=${k} class=${page===k?'on':''} onClick=${()=>setPage(k)}><span>${i}</span>${l}</button>`)}</nav>
<div class="ctl"><span>Afternoon peak temperature <b>${T}°C</b></span><input type="range" min="24" max="44" value=${T} onChange=${e=>setT(+e.target.value)}/></div>
<div class="ctl"><span>Simulated clock <b>${hOv==null?'Real time ('+hour+':00)':hOv+':00'}</b></span><input type="range" min="0" max="23" value=${hour} onChange=${e=>setHOv(+e.target.value)}/><button class="b" onClick=${()=>setHOv(null)}>Use real time</button></div>
<div class="ctl" style=${{flexDirection:'row',justifyContent:'space-between',alignItems:'center'}}><span>Peak pricing (18–22h)</span><${Switch} on=${tod} set=${setTod}/></div>
<div class="ctl" style=${{marginTop:'auto'}}>All data is simulated. Tariffs are illustrative, not from any utility.</div></aside>
<main class="main"><div class="top"><div><h1>${nav.find(n=>n[0]===page)[2]}</h1><div class="sub">${mode==='home'?'Household · Pune-style sample home':'Office · 30-seat sample office'}</div></div><span class="chip">SIMULATED DATA</span></div>
${page==='dash'?Dash:page==='app'?Apps:page==='fc'?Fc:page==='bill'?Bill:Sav}
<div class="foot">Smart Energy Usage Optimizer · Simulated data and illustrative Indian tariff for demonstration only.</div></main></div>`}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
